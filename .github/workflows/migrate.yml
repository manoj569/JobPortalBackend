name: Run EF Migrations on Azure

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      # ✅ CHANGED: Using v4 with persist-credentials: false to bypass token errors
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.0.x'

      - name: Restore NuGet packages
        run: dotnet restore JobPortal.API/JobPortal.API.csproj

      - name: Install EF Tool
        run: dotnet tool install --global dotnet-ef

      - name: Run Migration
        env:
          ConnectionStrings__DefaultConnection: ${{ secrets.AZURE_SQL_CONNECTION }}
        run: |
          cd JobPortal.API
          dotnet ef database update
